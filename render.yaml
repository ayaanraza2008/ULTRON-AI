services:
  - type: web
    name: ultron-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --ignore-scripts && git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view && cd .build-gods-eye-view && git checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad && npm ci && npm run build -- --base=/world-intelligence/ && cd .. && mkdir -p public/world-intelligence && cp -R .build-gods-eye-view/dist/. public/world-intelligence/
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        sync: false
      - key: ULTRON_AVAILABLE_MODELS
        value: "openrouter/free"
      - key: SUPABASE_URL
        value: https://opdjfhwepmcprbqojpat.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ULTRON_WORKER_POLL_MS
        value: "5000"
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COMFYUI_BASE_URL
        sync: false
      - key: HEYGEM_API_BASE_URL
        sync: false
      - key: HEYGEM_API_KEY
        sync: false
      - key: OMNIVOICE_API_BASE_URL
        sync: false
      - key: OMNIVOICE_API_KEY
        sync: false
      - key: ULTRON_HANDY_BRIDGE_URL
        sync: false
      - key: ULTRON_HANDY_BRIDGE_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: LOCAL_MODEL_TIMEOUT_SECONDS
        value: "90"
      - key: TAVILY_API_KEY
        sync: false
      - key: TTS_API_BASE_URL
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: STT_API_BASE_URL
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: ULTRON_DESKTOP_AGENT_URL
        sync: false
      - key: ULTRON_DESKTOP_AGENT_TOKEN
        sync: false
      - key: ULTRON_EMPLOYEES_ENABLED
        value: "false"
