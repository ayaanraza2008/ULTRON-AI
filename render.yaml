# ULTRON AI — Render workspace "Ultron core"
# This Blueprint maps the four existing live services in that workspace.
# It is a candidate configuration only. Do not sync it until the service/secret
# diff has been reviewed in Render Dashboard.

services:
  # 1. ULTRON AI backend
  - type: web
    name: ultron-ai-core
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "**/*.js"
        - "**/*.mjs"
        - "package.json"
        - "package-lock.json"
        - "public/**"
        - "supabase/migrations/**"
      ignoredPaths:
        - "tests/**"
        - "test/**"
        - "docs/**"
        - ".github/**"
        - "README.md"
        - "DEVELOPMENT_STATE.md"
        - ".env.example"
        - ".gitignore"
        - "public/world-intelligence-bridge.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      # This legacy/optional endpoint may be hosted outside this workspace.
      - key: WORLD_INTELLIGENCE_URL
        value: https://ultron-world-intelligence.onrender.com
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENVIKING_BASE_URL
        sync: false
      - key: OPENVIKING_API_TOKEN
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: "openrouter/free"
      - key: ULTRON_MODEL_PROVIDERS_JSON
        value: '[{"name":"nemotron-lightning-free","baseUrl":"https://openrouter.ai/api/v1","apiKeyEnv":"OPENROUTER_API_KEY","model":"nvidia/nemotron-3.5-lightning:free","priority":10,"supportsTools":true},{"name":"north-mini-code-free","baseUrl":"https://openrouter.ai/api/v1","apiKeyEnv":"OPENROUTER_API_KEY","model":"cohere/north-mini-code:free","priority":20,"supportsTools":true}]'
      - key: ULTRON_AVAILABLE_MODELS
        value: "openrouter/free,nvidia/nemotron-3.5-lightning:free,cohere/north-mini-code:free"
      - key: ULTRON_VISION_MODELS
        value: "openrouter/free,nvidia/nemotron-3.5-super-vl:free"
      - key: SUPABASE_URL
        value: https://opdjfhwepmcprbqojpat.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ULTRON_AUTH_CALLBACK_URL
        sync: false
      - key: ULTRON_AUTH_REDIRECT_URL
        sync: false
      - key: ULTRON_WORKER_POLL_MS
        value: "5000"
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: ULTRON_INTEGRATION_OWNER_USER_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Dedicated AES-GCM key for the Supabase-backed paired-device registry.
      - key: ULTRON_DEVICE_SIGNING_SECRET
        generateValue: true
      # Optional operator reset credential; without it, emergency-stop reset fails closed.
      - key: ULTRON_OPERATOR_MASTER_KEY
        sync: false
      - key: ULTRON_BROWSER_USE_URL
        value: https://ultron-browser-use-core.onrender.com
      # The browser bridge imports this same backend token with fromService below.
      - key: ULTRON_BROWSER_USE_TOKEN
        sync: false
      - key: COMFYUI_BASE_URL
        sync: false
      - key: COMFYUI_API_KEY
        sync: false
      - key: HEYGEM_JOB_PATH
        sync: false
      - key: OMNIVOICE_SYNTHESIS_PATH
        sync: false
      - key: ULTRON_HANDY_TRANSCRIBE_PATH
        sync: false
      - key: HEYGEM_API_BASE_URL
        sync: false
      - key: HEYGEM_API_KEY
        sync: false
      - key: OMNIVOICE_API_BASE_URL
        sync: false
      - key: OMNIVOICE_API_KEY
        sync: false
      - key: ULTRON_HANDY_BRIDGE_URL
        sync: false
      - key: ULTRON_HANDY_BRIDGE_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: LOCAL_MODEL_TIMEOUT_SECONDS
        value: "90"
      - key: TAVILY_API_KEY
        sync: false
      - key: TTS_API_BASE_URL
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: STT_API_BASE_URL
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: ULTRON_DESKTOP_AGENT_URL
        sync: false
      - key: ULTRON_DESKTOP_AGENT_TOKEN
        sync: false
      - key: ULTRON_EMPLOYEES_ENABLED
        value: "true"
      - key: GEO_SLEUTH_ENABLED
        value: "true"
      - key: GEO_SLEUTH_ROOT
        value: .runtime/geo-sleuth/skills/geo-sleuth

  # 2. ULTRON Living Core interface + same-origin API proxy
  - type: web
    name: ultron-core-interface
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --ignore-scripts
    startCommand: node core-ui-proxy.mjs
    healthCheckPath: /
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "core-ui-proxy.mjs"
        - "public/**"
        - "package.json"
        - "package-lock.json"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0

  # 3. Browser Use bridge — read-only public HTTPS navigation only
  - type: web
    name: ultron-browser-use-core
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r browser-use-bridge/requirements.txt && python -m playwright install --with-deps chromium
    startCommand: cd browser-use-bridge && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "browser-use-bridge/**"
    envVars:
      - key: ULTRON_BROWSER_USE_TOKEN
        fromService:
          type: web
          name: ultron-ai-core
          envVarKey: ULTRON_BROWSER_USE_TOKEN
      - key: ULTRON_MODEL_GATEWAY_BASE_URL
        value: https://ultron-ai-core.onrender.com/api/internal/browser-use/v1
      - key: OPENROUTER_DEFAULT_MODEL
        value: "openrouter/free"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ULTRON_ENABLE_CDP_BROWSER_AGENT
        value: "NO"

  # 4. REA authenticated MCP gateway
  - type: web
    name: ultron-rea-gateway
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: cd rea-gateway && npm install --omit=dev
    startCommand: cd rea-gateway && npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "rea-gateway/**"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: REA_MCP_TOKEN
        generateValue: true
