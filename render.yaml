services:
  - type: web
    name: ultron-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --ignore-scripts && mkdir -p .runtime && rm -rf .runtime/geo-sleuth && git clone --filter=blob:none https://github.com/Oldcircle/geo-sleuth.git .runtime/geo-sleuth && git -C .runtime/geo-sleuth checkout e01849f778afeb7c53ca79331313fbcfcb879486 && curl -LsSf https://astral.sh/uv/0.7.13/install.sh | sh
    startCommand: export PATH="$HOME/.local/bin:$PATH"; npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "**/*.js"
        - "**/*.mjs"
        - "package.json"
        - "package-lock.json"
        - "public/**"
        - "video-studio/**"
        - "supabase/migrations/**"
      ignoredPaths:
        - "tests/**"
        - "test/**"
        - "docs/**"
        - ".github/**"
        - "README.md"
        - "DEVELOPMENT_STATE.md"
        - ".env.example"
        - ".gitignore"
        - "public/world-intelligence-bridge.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORLD_INTELLIGENCE_URL
        value: https://ultron-world-intelligence.onrender.com
      - key: NODE_VERSION
        value: 24.14.0
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_DEFAULT_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-3.8-flash
      - key: OPENVIKING_BASE_URL
        sync: false
      - key: OPENVIKING_API_TOKEN
        sync: false
      - key: ULTRON_BROWSER_USE_URL
        value: https://ultron-browser-use.onrender.com
      - key: ULTRON_BROWSER_USE_TOKEN
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: "openrouter/free"
      - key: ULTRON_MODEL_PROVIDERS_JSON
        value: '[{"name":"nemotron-lightning-free","baseUrl":"https://openrouter.ai/api/v1","apiKeyEnv":"OPENROUTER_API_KEY","model":"nvidia/nemotron-3.5-lightning:free","priority":10,"supportsTools":true},{"name":"north-mini-code-free","baseUrl":"https://openrouter.ai/api/v1","apiKeyEnv":"OPENROUTER_API_KEY","model":"cohere/north-mini-code:free","priority":20,"supportsTools":true}]'
      - key: ULTRON_AVAILABLE_MODELS
        value: "openrouter/free,nvidia/nemotron-3.5-lightning:free,cohere/north-mini-code:free"
      - key: ULTRON_VISION_MODELS
        value: "openrouter/free,nvidia/nemotron-3.5-super-vl:free"
      - key: SUPABASE_URL
        value: https://opdjfhwepmcprbqojpat.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ULTRON_AUTH_CALLBACK_URL
        sync: false
      - key: ULTRON_AUTH_REDIRECT_URL
        sync: false
      - key: ULTRON_WORKER_POLL_MS
        value: "5000"
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: ULTRON_INTEGRATION_OWNER_USER_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COMFYUI_BASE_URL
        sync: false
      - key: COMFYUI_API_KEY
        sync: false
      - key: HEYGEM_JOB_PATH
        sync: false
      - key: OMNIVOICE_SYNTHESIS_PATH
        sync: false
      - key: ULTRON_HANDY_TRANSCRIBE_PATH
        sync: false
      - key: HEYGEM_API_BASE_URL
        sync: false
      - key: HEYGEM_API_KEY
        sync: false
      - key: OMNIVOICE_API_BASE_URL
        sync: false
      - key: OMNIVOICE_API_KEY
        sync: false
      - key: ULTRON_HANDY_BRIDGE_URL
        sync: false
      - key: ULTRON_HANDY_BRIDGE_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: LOCAL_MODEL_TIMEOUT_SECONDS
        value: "90"
      - key: TAVILY_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: FISH_AUDIO_VOICE_MODEL_ID
        value: "7a18a1851d2649108c48ec9f2c80eb2c"
      - key: FISH_AUDIO_TTS_MODEL
        value: "s2.1-pro-free"
      - key: FISH_AUDIO_STT_MODEL
        value: "transcribe-1"
      - key: TTS_API_BASE_URL
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: STT_API_BASE_URL
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: ULTRON_DESKTOP_AGENT_URL
        sync: false
      - key: ULTRON_DESKTOP_AGENT_TOKEN
        sync: false
      - key: ULTRON_EMPLOYEES_ENABLED
        value: "true"
      - key: GEO_SLEUTH_ENABLED
        value: "true"
      - key: GEO_SLEUTH_ROOT
        value: .runtime/geo-sleuth/skills/geo-sleuth

 
  - type: web
    name: ultron-browser-use
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r browser-use-bridge/requirements.txt
    startCommand: cd browser-use-bridge && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "browser-use-bridge/main.py"
        - "browser-use-bridge/navigation_policy.py"
        - "browser-use-bridge/requirements.txt"

  - type: web
    name: ultron-world-intelligence
    runtime: node
    plan: free
    region: singapore
    buildCommand: rm -rf .build-gods-eye-view && git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view && cd .build-gods-eye-view && git checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad && cd .. && node scripts/patch-world-intelligence-source.mjs && cd .build-gods-eye-view && npm ci --include=dev && npm run build && cd .. && node scripts/inject-world-intelligence-bridge.mjs
    startCommand: cd .build-gods-eye-view && npm run preview -- --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "scripts/patch-world-intelligence-source.mjs"
        - "scripts/inject-world-intelligence-bridge.mjs"
        - "public/world-intelligence-bridge.js"
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "1"
      - key: GEV_EMBED_FRAME_ANCESTORS
        value: https://ultron-ai-zvd7.onrender.com

  # Additional existing globe services are retained for backward compatibility.
  # Restrict their automatic rebuilds to the actual bridge inputs so API/test/doc
  # commits do not consume build minutes on identical external globe sources.
  - type: web
    name: ultron-world-intelligence-globe
    runtime: node
    plan: free
    region: singapore
    buildCommand: git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view && cd .build-gods-eye-view && git checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad && cd .. && node scripts/patch-world-intelligence-source.mjs && cd .build-gods-eye-view && npm ci && npm run build && cd .. && node scripts/inject-world-intelligence-bridge.mjs
    startCommand: cd .build-gods-eye-view && npm run preview -- --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "scripts/patch-world-intelligence-source.mjs"
        - "scripts/inject-world-intelligence-bridge.mjs"
        - "public/world-intelligence-bridge.js"

  - type: web
    name: ultron-world-intelligence-live
    runtime: node
    plan: free
    region: singapore
    buildCommand: rm -rf .build-gods-eye-view && git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view && cd .build-gods-eye-view && git checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad && cd .. && node scripts/patch-world-intelligence-source.mjs && cd .build-gods-eye-view && npm ci --include=dev && npm run build && cd .. && node scripts/inject-world-intelligence-bridge.mjs
    startCommand: cd .build-gods-eye-view && npm run preview -- --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "scripts/patch-world-intelligence-source.mjs"
        - "scripts/inject-world-intelligence-bridge.mjs"
        - "public/world-intelligence-bridge.js"
