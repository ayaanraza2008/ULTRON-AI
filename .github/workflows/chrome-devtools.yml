name: Chrome DevTools Bridge

on:
  push:
    paths:
      - "chrome-devtools/**"
      - ".github/workflows/chrome-devtools.yml"
  pull_request:
    paths:
      - "chrome-devtools/**"
      - ".github/workflows/chrome-devtools.yml"

jobs:
  typescript-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install bridge dependencies
        working-directory: chrome-devtools
        run: npm install --no-audit --no-fund
      - name: Build TypeScript and run security tests
        working-directory: chrome-devtools
        run: npm test
