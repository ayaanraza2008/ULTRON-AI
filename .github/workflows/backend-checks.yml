name: Backend checks

on:
  pull_request:
  push:
    branches: [main, feat/kaligpt-capability-integration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Test suite
        run: npm test
