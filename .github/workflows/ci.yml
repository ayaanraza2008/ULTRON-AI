name: ULTRON CI
on:
  push:
    branches:
      - main
      - feat/kaligpt-capability-integration
      - feat/ultron-capability-integration
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Browser Use bridge policy and Python syntax
        run: |
          python -m py_compile browser-use-bridge/main.py browser-use-bridge/navigation_policy.py browser-use-bridge/test_navigation_policy.py
          python browser-use-bridge/test_navigation_policy.py
      - run: npm install --ignore-scripts
      - name: Report high-severity runtime dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Run tests including the public HTTPS transport smoke test
        env:
          ULTRON_SAFE_OUTBOUND_TRANSPORT_LIVE_TEST: "YES"
        run: npm test
      - name: Smoke test deployed health endpoint
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent https://ultron-ai-zvd7.onrender.com/api/health -o /tmp/ultron-health.json; then
              cat /tmp/ultron-health.json
              node -e "const d=require('/tmp/ultron-health.json'); const required=['providerConfigured','accessConfigured','supabaseConfigured']; const missing=required.filter(k=>d[k]!==true); if(d.status!=='ok'||missing.length){console.error('Health/configuration check failed:', {status:d.status,missing}); process.exit(1)}; console.log('Runtime configuration flags verified:', required.join(', ')); const commit=d.build?.commit; if(commit) console.log('Currently deployed commit:', commit); else console.warn('Live health endpoint does not expose a deployed revision yet; it may be running an older build.'); if(process.env.GITHUB_EVENT_NAME==='push'&&process.env.GITHUB_REF==='refs/heads/main'){if(!commit){console.error('Production deployment drift: health endpoint does not expose a deployed revision; refusing to mark this release verified.');process.exit(1)}if(commit!==process.env.GITHUB_SHA){console.error('Production deployment lag detected: live commit differs from this source commit; release is not production-verified.');process.exit(1)}console.log('Production revision matches the pushed source commit.')}else if(commit&&commit!==process.env.GITHUB_SHA) console.warn('Production deployment lag detected: the live revision differs from this CI source revision; PR/source CI does not imply production deployment.')"
              exit 0
            fi
            sleep 8
          done
          echo 'Deployed health endpoint did not become ready in time.'
          exit 1

  world-intelligence-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout pinned God’s Eye source
        run: |
          rm -rf .build-gods-eye-view
          git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view
          git -C .build-gods-eye-view checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad
      - name: Patch allowlisted action runner
        run: node scripts/patch-world-intelligence-source.mjs
      - name: Build pinned globe
        working-directory: .build-gods-eye-view
        run: |
          npm ci --include=dev
          npm run build
      - name: Verify injected ULTRON bridge
        run: |
          node scripts/inject-world-intelligence-bridge.mjs
          test -f .build-gods-eye-view/dist/ultron-bridge.js
          grep -q 'ultron-bridge.js' .build-gods-eye-view/dist/index.html
