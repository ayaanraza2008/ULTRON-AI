name: ULTRON CI
on:
  push:
    branches:
      - main
      - feat/kaligpt-capability-integration
      - feat/ultron-capability-integration
      - feat/**
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Browser Use bridge policy and Python syntax
        run: |
          python -m py_compile browser-use-bridge/main.py browser-use-bridge/navigation_policy.py browser-use-bridge/startup_smoke.py browser-use-bridge/test_navigation_policy.py browser-use-bridge/test_startup_smoke.py
          python browser-use-bridge/test_navigation_policy.py
          python browser-use-bridge/test_startup_smoke.py
      - name: Verify ULTRON Model Lab Python CLI
        run: |
          python -m py_compile tools/model-lab/ultron_model_lab.py
          python -m unittest discover -s tools/model-lab -p 'test_*.py'
      - name: Verify local-first Python personal assistant
        run: |
          python -m py_compile tools/local-assistant/ultron_local_assistant/__init__.py tools/local-assistant/ultron_local_assistant/__main__.py tools/local-assistant/ultron_local_assistant/core.py tools/local-assistant/ultron_local_assistant/google_workspace.py tools/local-assistant/ultron_local_assistant/skills.py tools/local-assistant/ultron_local_assistant/cli.py tools/local-assistant/tests/test_local_assistant.py
          python -m unittest discover -s tools/local-assistant/tests -p 'test_*.py'
      - run: npm install --ignore-scripts
      - name: Report high-severity runtime dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
  local-assistant-windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse guided PowerShell installer without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/local-assistant/setup.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

  world-intelligence-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout pinned God’s Eye source
        run: |
          rm -rf .build-gods-eye-view
          git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view
          git -C .build-gods-eye-view checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad
      - name: Patch allowlisted action runner
        run: node scripts/patch-world-intelligence-source.mjs
      - name: Build pinned globe
        working-directory: .build-gods-eye-view
        run: |
          npm ci --include=dev
          npm run build
      - name: Verify injected ULTRON bridge
        run: |
          node scripts/inject-world-intelligence-bridge.mjs
          test -f .build-gods-eye-view/dist/ultron-bridge.js
          grep -q 'ultron-bridge.js' .build-gods-eye-view/dist/index.html
