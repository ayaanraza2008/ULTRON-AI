name: ULTRON CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Smoke test deployed health endpoint
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent https://ultron-ai-zvd7.onrender.com/api/health -o /tmp/ultron-health.json; then
              cat /tmp/ultron-health.json
              node -e "const d=require('/tmp/ultron-health.json'); if(d.status!=='ok') process.exit(1)"
              exit 0
            fi
            sleep 8
          done
          echo 'Deployed health endpoint did not become ready in time.'
          exit 1

  world-intelligence-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Checkout pinned God's Eye View source
        run: |
          git clone https://github.com/bilawalsidhu/gods-eye-view.git /tmp/gods-eye-view
          git -C /tmp/gods-eye-view checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad
      - name: Install and build the globe workspace
        working-directory: /tmp/gods-eye-view
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build -- --base=/world-intelligence/
      - name: Verify the browser bundle exists
        run: test -s /tmp/gods-eye-view/dist/index.html
