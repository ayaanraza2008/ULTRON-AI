name: ULTRON CI
on:
  push:
    branches:
      - main
      - feat/kaligpt-capability-integration
      - feat/ultron-capability-integration
  pull_request:
    branches:
      - main
      - feat/ultron-capability-integration
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Smoke test deployed health endpoint
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent https://ultron-ai-zvd7.onrender.com/api/health -o /tmp/ultron-health.json; then
              cat /tmp/ultron-health.json
              node -e "const d=require('/tmp/ultron-health.json'); if(d.status!=='ok') process.exit(1)"
              exit 0
            fi
            sleep 8
          done
          echo 'Deployed health endpoint did not become ready in time.'
          exit 1
