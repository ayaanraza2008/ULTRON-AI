name: ULTRON CI
on:
  push:
    branches:
      - main
      - feat/kaligpt-capability-integration
      - feat/ultron-capability-integration
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Browser Use bridge policy and Python syntax
        run: |
          python -m py_compile browser-use-bridge/main.py browser-use-bridge/navigation_policy.py browser-use-bridge/test_navigation_policy.py
          python browser-use-bridge/test_navigation_policy.py
      - run: npm install --ignore-scripts
      - name: Report high-severity runtime dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Run tests with live pinned HTTPS smoke enabled
        env:
          ULTRON_SAFE_OUTBOUND_LIVE_TEST: "YES"
        run: npm test
  production-verification:
    # Keep production state separate from source correctness. This read-only
    # check runs only when an operator manually dispatches the workflow on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the live production revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent https://ultron-ai-zvd7.onrender.com/api/health -o /tmp/ultron-health.json; then
              node --input-type=commonjs -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/ultron-health.json","utf8")); const required=["providerConfigured","accessConfigured","supabaseConfigured"]; const missing=required.filter(k=>d[k]!==true); if(d.status!=="ok"||missing.length){console.error("Health/configuration check failed:", {status:d.status,missing});process.exit(1)}; const commit=d.build?.commit; if(!/^[0-9a-f]{40}$/i.test(String(commit||""))){console.error("Production revision is missing or invalid; production is not verified.");process.exit(1)}; if(commit.toLowerCase()!==process.env.EXPECTED_COMMIT.toLowerCase()){console.error("Production revision mismatch; production is not verified.");process.exit(1)}; console.log("Production revision and required runtime configuration verified:",commit)'
              exit 0
            fi
            sleep 8
          done
          echo 'Deployed health endpoint did not become ready in time.'
          exit 1
  world-intelligence-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Checkout pinned God’s Eye source
        run: |
          rm -rf .build-gods-eye-view
          git clone https://github.com/bilawalsidhu/gods-eye-view.git .build-gods-eye-view
          git -C .build-gods-eye-view checkout 7be5937fc3e3b10cdfa8d3f833536167268768ad
      - name: Patch allowlisted action runner
        run: node scripts/patch-world-intelligence-source.mjs
      - name: Build pinned globe
        working-directory: .build-gods-eye-view
        run: |
          npm ci --include=dev
          npm run build
      - name: Verify injected ULTRON bridge
        run: |
          node scripts/inject-world-intelligence-bridge.mjs
          test -f .build-gods-eye-view/dist/ultron-bridge.js
          grep -q 'ultron-bridge.js' .build-gods-eye-view/dist/index.html
