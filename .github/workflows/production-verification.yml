name: ULTRON Production Revision Verification
on:
  push:
    branches:
      - main
    # Mirror the Render Core build filter. A tools/docs/tests-only commit does
    # not deploy the service and cannot be expected to match its deployed SHA.
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "supabase/migrations/**"
      - "!tests/**"
      - "!test/**"
      - "!docs/**"
      - "!.github/**"
      - "!README.md"
      - "!DEVELOPMENT_STATE.md"
      - "!.env.example"
      - "!.gitignore"
      - "!public/world-intelligence-bridge.js"
  workflow_dispatch:

# Only the newest main revision needs production verification. This prevents an
# older run from failing because a newer commit has already triggered a deploy.
concurrency:
  group: ultron-production-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Verify same-origin frontend assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://ultron-ai-core.onrender.com"
          for i in $(seq 1 10); do
            if curl --fail --silent --show-error "$base/" -o /tmp/ultron-index.html &&
               curl --fail --silent --show-error "$base/app.js" -o /tmp/ultron-app.js &&
               curl --fail --silent --show-error "$base/styles.css" -o /tmp/ultron-styles.css &&
               grep -q "ULTRON AI — Living Core" /tmp/ultron-index.html &&
               grep -q "UPSTREAM_API_FALLBACK" /tmp/ultron-app.js; then
              echo "Same-origin UI assets verified."
              exit 0
            fi
            echo "Same-origin UI assets not ready (attempt $i/10); retrying."
            sleep 8
          done
          echo "Same-origin UI asset verification failed."
          exit 1
      - name: Verify health, required configuration, and deployed revision
        shell: bash
        run: |
          set -euo pipefail
          url="https://ultron-ai-core.onrender.com/api/health"
          for i in $(seq 1 10); do
            if ! curl --fail --silent --show-error "$url" -o /tmp/ultron-health.json; then
              echo "Health endpoint not ready (attempt $i/10); retrying."
            elif node -e 'const fs=require("node:fs"); let d; try { d=JSON.parse(fs.readFileSync("/tmp/ultron-health.json","utf8")); } catch { console.error("Health endpoint returned invalid JSON."); process.exit(1); } const required=["providerConfigured","accessConfigured","supabaseConfigured"]; const missing=required.filter(k=>d[k]!==true); if(d.status!=="ok"||missing.length){console.error("Health/configuration check failed:",{status:d.status,missing});process.exit(1)} const commit=d.build?.commit; if(!commit){console.error("Production revision is unknown: health endpoint does not expose a deployed commit.");process.exit(1)} if(commit!==process.env.GITHUB_SHA){console.error("Production deployment is stale; retrying:",{deployedCommit:commit,expectedCommit:process.env.GITHUB_SHA});process.exit(1)} console.log("Production health, required configuration, and revision match verified.");'; then
              exit 0
            else
              echo "Production verification did not pass (attempt $i/10); retrying."
            fi
            sleep 8
          done
          echo "Production health/configuration/revision check failed after 10 attempts; release is NOT production-verified."
          exit 1
