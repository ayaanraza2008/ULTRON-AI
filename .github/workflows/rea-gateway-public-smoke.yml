name: REA Gateway Public Smoke

on:
  push:
    branches:
      - test/rea-gateway-public-smoke
    paths:
      - ".github/workflows/rea-gateway-public-smoke.yml"

permissions:
  contents: read

jobs:
  public-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live REA feature-trace readiness
        shell: bash
        run: |
          set -euo pipefail
          base="https://ultron-rea-gateway.onrender.com"
          ready=0
          for attempt in $(seq 1 24); do
            body="$(curl --silent --show-error --max-time 10 "$base/healthz" || true)"
            if printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s);process.exit(v.status==="ok"?0:1)}catch{process.exit(1)}})'; then
              echo "Gateway health response: $body"
              ready=1
              break
            fi
            echo "Gateway not yet ready (attempt $attempt/24)."
            sleep 5
          done
          test "$ready" = "1"

      - name: Verify public MCP requests require a bearer token
        shell: bash
        run: |
          set -euo pipefail
          base="https://ultron-rea-gateway.onrender.com"
          status="$(curl --silent --show-error --max-time 10 --output /tmp/rea-unauthorized.json --write-out '%{http_code}' -X POST "$base/mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          test "$status" = "401"
          grep -q '"error":"unauthorized"' /tmp/rea-unauthorized.json
          echo "Unauthenticated MCP request correctly rejected with HTTP 401."
