name: REA Gateway Live Smoke

on:
  push:
    branches:
      - feat/rea-gateway-live-smoke-check
    paths:
      - ".github/workflows/rea-gateway-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify gateway and its loopback REA listener
        shell: bash
        run: |
          set -euo pipefail
          url="https://ultron-rea-gateway.onrender.com"
          healthy=0
          for attempt in $(seq 1 12); do
            body="$(curl --silent --show-error --max-time 10 "$url/healthz" || true)"
            if printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);process.exit(d.status==="ok"?0:1)}catch{process.exit(1)}})'; then
              healthy=1
              break
            fi
            echo "REA gateway is not ready (attempt $attempt/12)."
            sleep 5
          done
          test "$healthy" = "1"

      - name: Verify missing credentials are rejected
        shell: bash
        run: |
          set -euo pipefail
          url="https://ultron-rea-gateway.onrender.com"
          status="$(curl --silent --show-error --max-time 10 --output /tmp/rea-unauthorized.json --write-out '%{http_code}' -X POST "$url/mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          test "$status" = "401"
          grep -q '"error":"unauthorized"' /tmp/rea-unauthorized.json
