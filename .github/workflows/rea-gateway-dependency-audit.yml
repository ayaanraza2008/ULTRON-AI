name: REA gateway dependency audit

on:
  push:
    branches:
      - "audit/rea-gateway-dependency-audit-*"
    paths:
      - "rea-gateway/package.json"
      - ".github/workflows/rea-gateway-dependency-audit.yml"
  pull_request:
    paths:
      - "rea-gateway/package.json"
      - ".github/workflows/rea-gateway-dependency-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Render-compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: rea-gateway/package.json

      - name: Generate ephemeral lockfile without lifecycle scripts
        working-directory: rea-gateway
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Capture vulnerable package versions and dependency paths
        working-directory: rea-gateway
        shell: bash
        run: |
          npm ls --omit=dev --all --json > npm-tree.json || true
          npm explain glob minimatch zod @electron/asar frida || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const tree = JSON.parse(fs.readFileSync('npm-tree.json', 'utf8'));
          const wanted = new Set(['rea-agents', '@electron/asar', 'frida', 'glob', 'minimatch', 'zod']);
          const visit = (deps, prefix = []) => {
            for (const [name, item] of Object.entries(deps || {})) {
              const path = [...prefix, name];
              if (wanted.has(name)) console.log(JSON.stringify({ path: path.join(' > '), version: item.version || null, invalid: item.invalid || false, problems: item.problems || [] }));
              visit(item.dependencies, path);
            }
          };
          visit(tree.dependencies);
          NODE

      - name: Audit production dependencies and print advisory identities
        working-directory: rea-gateway
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_status=$?
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production dependency vulnerability counts:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              effects: item.effects || [],
              nodes: item.nodes || [],
              via: (item.via || []).map(v => typeof v === 'string' ? v : ({
                title: v.title,
                url: v.url,
                range: v.range,
                severity: v.severity,
                cwe: v.cwe,
                cvss: v.cvss
              }))
            }));
          }
          NODE
          exit "$audit_status"

      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-gateway-npm-audit
          path: |
            rea-gateway/npm-audit.json
            rea-gateway/npm-tree.json
          if-no-files-found: ignore
          retention-days: 14
