name: ULTRON Android Companion

on:
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK tools and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages with sdkmanager
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "8.9"
          cache-provider: basic
      - name: Compile debug APK
        working-directory: android-companion
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ULTRON-Android-Wake-Companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
